<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: var(--bg-color, #0a0a0a); }
    .terminal-bg { fill: var(--bg-color, #1a1a1a); opacity: 0.95; }
    .terminal-border { fill: none; stroke: var(--accent-color, #00ff41); stroke-width: 2; }
    .terminal-text { fill: var(--accent-color, #00ff41); font-family: 'Space Mono', monospace; }
    .grid { stroke: var(--accent-color, #00ff41); stroke-width: 0.5; opacity: 0.2; }
  </style>

  <!-- Background -->
  <rect class="bg" width="1200" height="400"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path class="grid" d="M 40 0 L 0 0 0 40"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Terminal Window -->
  <rect class="terminal-bg" x="200" y="80" width="800" height="240" rx="8"/>
  <rect class="terminal-border" x="200" y="80" width="800" height="240" rx="8"/>

  <!-- Terminal Header -->
  <line class="terminal-border" x1="200" y1="120" x2="1000" y2="120"/>
  <circle fill="var(--accent-color)" cx="220" cy="100" r="6" opacity="0.6"/>
  <circle fill="var(--accent-color)" cx="240" cy="100" r="6" opacity="0.6"/>
  <circle fill="var(--accent-color)" cx="260" cy="100" r="6" opacity="0.6"/>

  <!-- Terminal Content -->
  <text class="terminal-text" x="230" y="160" font-size="18">$ whoami</text>
  <text class="terminal-text" x="230" y="190" font-size="14">shashank</text>
  <text class="terminal-text" x="230" y="220" font-size="18">$ echo "Hello World"</text>
  <text class="terminal-text" x="230" y="250" font-size="14">Hello World</text>
  <text class="terminal-text" x="230" y="280" font-size="18">$ _</text>

  <!-- Abstract Code Elements -->
  <text class="terminal-text" x="50" y="50" font-size="12" opacity="0.3">&lt;code&gt;</text>
  <text class="terminal-text" x="1100" y="350" font-size="12" opacity="0.3">&lt;/code&gt;</text>

  <!-- Function brackets decoration -->
  <text class="terminal-text" x="150" y="200" font-size="60" opacity="0.15">{</text>
  <text class="terminal-text" x="1020" y="240" font-size="60" opacity="0.15">}</text>
</svg>

<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: var(--bg-color, #0f0f0f); }
    .primary { stroke: var(--border-color, #ffffff); stroke-width: 2; fill: none; }
    .accent { fill: var(--accent-color, #ffffff); opacity: 0.2; }
    .accent-solid { fill: var(--accent-color, #ffffff); }
    .text { fill: var(--text-color, #ffffff); font-family: 'Space Mono', monospace; }
    .code-bg { fill: var(--text-color, #ffffff); opacity: 0.05; }
  </style>

  <!-- Background -->
  <rect class="bg" width="1200" height="400"/>

  <!-- Code Editor Window -->
  <g transform="translate(150, 60)">
    <!-- Editor Border -->
    <rect class="primary" x="0" y="0" width="900" height="280" rx="8"/>

    <!-- Editor Header -->
    <rect class="accent" x="0" y="0" width="900" height="40" rx="8"/>
    <rect class="bg" x="0" y="20" width="900" height="20"/>

    <!-- Window Controls -->
    <circle class="accent-solid" cx="20" cy="20" r="6"/>
    <circle class="accent-solid" cx="45" cy="20" r="6"/>
    <circle class="accent-solid" cx="70" cy="20" r="6"/>

    <!-- File Tab -->
    <rect class="code-bg" x="100" y="8" width="140" height="24" rx="4"/>
    <text class="text" x="170" y="26" text-anchor="middle" font-size="12">blog_template.html</text>

    <!-- Line Numbers -->
    <text class="text" x="20" y="75" font-size="12" opacity="0.4">1</text>
    <text class="text" x="20" y="95" font-size="12" opacity="0.4">2</text>
    <text class="text" x="20" y="115" font-size="12" opacity="0.4">3</text>
    <text class="text" x="20" y="135" font-size="12" opacity="0.4">4</text>
    <text class="text" x="20" y="155" font-size="12" opacity="0.4">5</text>
    <text class="text" x="20" y="175" font-size="12" opacity="0.4">6</text>
    <text class="text" x="20" y="195" font-size="12" opacity="0.4">7</text>
    <text class="text" x="20" y="215" font-size="12" opacity="0.4">8</text>

    <!-- Code Content -->
    <text class="text" x="50" y="75" font-size="12">&lt;!DOCTYPE html&gt;</text>
    <text class="text" x="50" y="95" font-size="12">&lt;html lang="en"&gt;</text>
    <text class="text" x="70" y="115" font-size="12">&lt;head&gt;</text>
    <text class="text" x="90" y="135" font-size="12" opacity="0.6">&lt;title&gt;</text>
    <text class="accent-solid" x="165" y="135" font-size="12">{{TITLE}}</text>
    <text class="text" x="245" y="135" font-size="12" opacity="0.6">&lt;/title&gt;</text>
    <text class="text" x="70" y="155" font-size="12">&lt;/head&gt;</text>
    <text class="text" x="70" y="175" font-size="12">&lt;body&gt;</text>
    <text class="text" x="90" y="195" font-size="12" opacity="0.6">&lt;article&gt;</text>
    <text class="accent-solid" x="110" y="215" font-size="12">{{CONTENT}}</text>

    <!-- Cursor -->
    <rect class="accent-solid" x="200" y="205" width="2" height="14"/>
  </g>

  <!-- Terminal Command Below -->
  <g transform="translate(150, 360)">
    <text class="text" x="0" y="0" font-size="14">$ ./createblog.sh "New Post"</text>
    <line class="primary" x1="0" y1="10" x2="250" y2="10"/>
  </g>

  <!-- Decorative Elements -->
  <g transform="translate(50, 150)">
    <path class="primary" d="M 0,0 L 20,20 L 0,40" stroke-width="3"/>
  </g>

  <g transform="translate(1130, 150)">
    <path class="primary" d="M 20,0 L 0,20 L 20,40" stroke-width="3"/>
  </g>

  <!-- Abstract HTML Tag -->
  <text class="text" x="40" y="40" font-size="14" opacity="0.2">&lt;/&gt;</text>
  <text class="text" x="1140" y="380" font-size="14" opacity="0.2">&lt;/&gt;</text>
</svg>
